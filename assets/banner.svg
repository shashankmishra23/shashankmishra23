<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Shashank Mishra, Aspiring Data Scientist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#0f1f33"/>
      <stop offset="1" stop-color="#132b45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58e6c1"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe8d5"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .up { opacity: 0; animation: up 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .b { transform-box: fill-box; transform-origin: bottom; animation: grow 7s ease-in-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
      .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 7s ease-in-out infinite; }
      @keyframes draw { 0%, 15% { stroke-dashoffset: 420; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 420; } }
      .pt { opacity: 0; animation: pt 7s ease-in-out infinite; }
      @keyframes pt { 0%, 38% { opacity: 0; } 45%, 85% { opacity: 1; } 100% { opacity: 0; } }
      .f { animation: float 6s ease-in-out infinite; }
      .f2 { animation: float 8s ease-in-out infinite reverse; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g class="f" fill="#58e6c1" fill-opacity="0.35">
    <circle cx="640" cy="60" r="3"/><circle cx="600" cy="300" r="2.5"/><circle cx="1170" cy="310" r="3"/>
    <circle cx="30" cy="40" r="2"/><circle cx="420" cy="30" r="2.5"/>
  </g>
  <g class="f2" fill="#2f81f7" fill-opacity="0.45">
    <circle cx="560" cy="90" r="2.5"/><circle cx="690" cy="270" r="3"/><circle cx="1180" cy="30" r="2"/>
    <circle cx="40" cy="310" r="3"/>
  </g>

  <g class="up d1">
    <circle cx="76" cy="104" r="5" fill="#58e6c1" class="blink"/>
    <text x="90" y="110" font-size="15" font-weight="600" fill="#58e6c1" letter-spacing="3.5">DATA SCIENCE · MACHINE LEARNING · ANALYTICS</text>
  </g>
  <text x="68" y="178" font-size="60" font-weight="700" fill="url(#title)" class="up d2">Shashank Mishra</text>
  <text x="70" y="224" font-size="28" fill="#9fb3c8" class="up d3">Aspiring Data Scientist</text>

  <g class="up d4" font-size="15" font-weight="600" fill="#d7e3ee">
    <rect x="70" y="252" width="80" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#58e6c1" stroke-opacity="0.5"/>
    <text x="110" y="273" text-anchor="middle">Python</text>
    <rect x="160" y="252" width="60" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#58e6c1" stroke-opacity="0.5"/>
    <text x="190" y="273" text-anchor="middle">SQL</text>
    <rect x="230" y="252" width="166" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#58e6c1" stroke-opacity="0.5"/>
    <text x="313" y="273" text-anchor="middle">Machine Learning</text>
    <rect x="406" y="252" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#58e6c1" stroke-opacity="0.5"/>
    <text x="476" y="273" text-anchor="middle">Deep Learning</text>
    <rect x="556" y="252" width="98" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#58e6c1" stroke-opacity="0.5"/>
    <text x="605" y="273" text-anchor="middle">Power BI</text>
  </g>

  <g class="up d3">
    <rect x="730" y="46" width="410" height="250" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="756" cy="72" r="5" fill="#ff5f57"/><circle cx="774" cy="72" r="5" fill="#febc2e"/><circle cx="792" cy="72" r="5" fill="#28c840"/>
    <text x="1116" y="77" font-size="13" fill="#7d8fa3" text-anchor="end" font-family="Consolas, monospace">insights.ipynb</text>
    <g stroke="#ffffff" stroke-opacity="0.08">
      <line x1="760" y1="120" x2="1112" y2="120"/><line x1="760" y1="170" x2="1112" y2="170"/>
      <line x1="760" y1="220" x2="1112" y2="220"/>
    </g>
    <line x1="760" y1="268" x2="1112" y2="268" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>

  <g fill="url(#bar)">
    <rect class="b" style="animation-delay:0s"    x="772"  y="208" width="30" height="60" rx="4"/>
    <rect class="b" style="animation-delay:0.08s" x="820"  y="178" width="30" height="90" rx="4"/>
    <rect class="b" style="animation-delay:0.16s" x="868"  y="196" width="30" height="72" rx="4"/>
    <rect class="b" style="animation-delay:0.24s" x="916"  y="148" width="30" height="120" rx="4"/>
    <rect class="b" style="animation-delay:0.32s" x="964"  y="164" width="30" height="104" rx="4"/>
    <rect class="b" style="animation-delay:0.40s" x="1012" y="122" width="30" height="146" rx="4"/>
    <rect class="b" style="animation-delay:0.48s" x="1060" y="108" width="30" height="160" rx="4"/>
  </g>
  <polyline class="line" points="787,190 835,160 883,176 931,128 979,142 1027,104 1075,92" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="pt" fill="#ffd166" stroke="#0d1117" stroke-width="2">
    <circle cx="787" cy="190" r="5"/><circle cx="835" cy="160" r="5"/><circle cx="883" cy="176" r="5"/>
    <circle cx="931" cy="128" r="5"/><circle cx="979" cy="142" r="5"/><circle cx="1027" cy="104" r="5"/>
    <circle cx="1075" cy="92" r="5"/>
  </g>
</svg>
