<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Power BI Dashboards projects">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c811"/><stop offset="0.55" stop-color="#f2c811" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f2c811" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="596" height="206" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 45%, 100% { transform: translateX(760px) skewX(-20deg); } }
      .glow { transform-box: fill-box; transform-origin: center; animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.06; transform: scale(1); } 50% { opacity: 0.15; transform: scale(1.15); } }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
      .cell { opacity: 0; animation: cell 3s ease-in-out infinite; }
      @keyframes cell { 0%, 100% { opacity: 0; } 30%, 60% { opacity: 0.6; } }
      .layer { animation: layer 1.8s ease-in-out infinite; }
      @keyframes layer { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.25; } }
      .draw { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw 3.5s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 90; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 90; } }
      .pop { opacity: 0; animation: pop 3.5s ease-in-out infinite; }
      @keyframes pop { 0%, 15% { opacity: 0; } 35%, 85% { opacity: 1; } 100% { opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 3s ease-in-out infinite; }
      @keyframes bar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      .spin { transform-origin: 38px 38px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .node { transform-box: fill-box; transform-origin: center; animation: node 1.5s ease-in-out infinite; }
      @keyframes node { 0%, 100% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="210" fill="#0d1117"/>
    <circle class="glow" cx="540" cy="30" r="110" fill="#f2c811"/>
    <rect class="sweep" x="0" y="-20" width="140" height="250" fill="url(#shine)"/>
  </g>
  <rect x="2" y="2" width="596" height="206" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g transform="translate(30 30)">
    <rect width="76" height="76" rx="16" fill="#f2c811" fill-opacity="0.12" stroke="#f2c811" stroke-opacity="0.6"/>
    
      <line x1="12" y1="60" x2="64" y2="60" stroke="#f2c811" stroke-opacity="0.5" stroke-width="2"/>
      <rect class="bar" x="16" y="40" width="9" height="20" rx="2" fill="#f2c811"/>
      <rect class="bar" style="animation-delay:0.15s" x="29" y="28" width="9" height="32" rx="2" fill="#f2c811"/>
      <rect class="bar" style="animation-delay:0.3s" x="42" y="34" width="9" height="26" rx="2" fill="#f2c811"/>
      <rect class="bar" style="animation-delay:0.45s" x="55" y="16" width="9" height="44" rx="2" fill="#f2c811"/>
  </g>
  <text x="566" y="52" text-anchor="end" font-size="18" class="mono" fill="#ffffff" fill-opacity="0.28">04</text>
  <text x="128" y="66" font-size="30" font-weight="700" fill="#ffffff">Power BI Dashboards</text>
  <text x="128" y="100" font-size="18" fill="#9fb3c8">Dashboards · KPIs · Reports</text>
  <line x1="30" y1="140" x2="570" y2="140" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="30" y="178" font-size="16" class="mono" fill="#f2c811">#power-bi</text>
  <g class="arrow"><text x="566" y="178" text-anchor="end" font-size="17" font-weight="600" fill="#e6edf3">View projects  →</text></g>
</svg>
